
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'features/**'
  pull_request:
    branches:
      - main
      - dev
      - 'features/**'

permissions:
  contents: read

jobs:
  # -----------------------------------------
  # CI: Laravel backend tests
  # -----------------------------------------
  backend-test:
    name: Laravel Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Laravel environment
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          cp .env.example .env
          php artisan config:clear

      - name: Run Laravel tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: php artisan test

  # -----------------------------------------
  # CI: Vue frontend build
  # -----------------------------------------
  frontend-build:
    name: Vue Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  # -----------------------------------------
  # CD: Publish Docker images to GHCR
  # -----------------------------------------
  deploy:
    name: Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names and commit tag
        id: image
        shell: bash
        run: |
          REPOSITORY=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Laravel backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repository }}-backend:${{ steps.image.outputs.tag }}

      - name: Build and push Vue frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: ghcr.io/${{ steps.image.outputs.repository }}-frontend:${{ steps.image.outputs.tag }}
